  const segs=FN.cmp==='dev'?[['Mobile',s=>S_dv[s]===0,'var(--s1)'],['Desktop',s=>S_dv[s]===1,'var(--s2)']]:[['Игроки в аккаунте',s=>S_au[s]===1,'var(--s1)'],['Гости',s=>S_au[s]===0,'var(--s2)']];
  const res=segs.map(([nm,f,col])=>[nm,runFunnel(ACT.filter(f),FN.steps).cnt,col]);
  box.innerHTML=`<h2 style="font-size:14px;margin:18px 0 8px">Сравнение сегментов</h2><div class="tbl-wrap"><table><thead><tr><th>Сегмент</th>${FN.steps.map((id,i)=>`<th class="num">${i+1}. ${esc(STEPS[id][0])}</th>`).join('')}<th class="num">Итог</th></tr></thead><tbody>${res.map(([nm,cc,col])=>`<tr><td><span class="pill" style="background:transparent;padding-left:0"><i style="width:10px;height:10px;border-radius:3px;background:${col};display:inline-block"></i>${nm}</span></td>${cc.map((v,i)=>`<td class="num">${fmt(v)}${i?`<div class="muted" style="font-size:11px">${pct(v,cc[i-1])}%</div>`:''}</td>`).join('')}<td class="num"><b>${pct(cc[n-1],cc[0])}%</b></td></tr>`).join('')}</tbody></table></div>`;
}

/* ================= JOURNEYS ================= */
const JN={0:'Главная',1:'Каталог',2:'Каталог',3:'Игра',4:'Демо-игра',5:'Акции',6:'Кабинет игрока',7:'Сообщения',8:'Спорт',9:'Приложение',10:'Инфо',11:'Ошибка',12:'Другое'};
const JCOL={'Главная':'var(--s1)','Каталог':'var(--s3)','Игра':'var(--s4)','Демо-игра':'var(--s4)','Касса':'var(--good)','Оплата ✓':'var(--good)','Оплата ✗':'var(--crit)','Выход':'var(--soft)','Акции':'var(--s2)'};
const JR={start:'start',cols:5};
function seqOf(s){const a=S_e0[s],b=a+S_en[s],out=[];for(let e=a;e<b;e++){const k=E_k[e];let n=null;if(k===0)n=JN[P_cat[E_p[e]]];else if(k===3)n='Касса';else if(k===15)n='Оплата ✓';else if(k===16)n='Оплата ✗';if(n&&out[out.length-1]!==n)out.push(n)}return out}
function renderJourneys(){
  const view=$('#view');
  view.innerHTML=headHtml('Пути','Как игроки двигаются по сайту: первые шаги сессии от входа до выхода. Шаг — тип страницы или возврат с оплаты (событие кассы в Magic365 не отправляется); повторы подряд схлопнуты.')+`
  <div class="card"><div class="card-h"><div><h2>Карта путей</h2><div class="sub" id="jr-sub"></div></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><select class="sel" id="jr-start" aria-label="Начало пути"><option value="start">От начала сессии</option><option value="Главная">От главной</option><option value="Каталог">От каталога</option><option value="Акции">От акций</option><option value="Игра">От игры</option></select>
    <div class="seg" role="group" aria-label="Число шагов" id="jr-cols"><button type="button" data-v="4">4 шага</button><button type="button" data-v="5">5 шагов</button><button type="button" data-v="6">6 шагов</button></div></div></div>
    <div id="jr-sankey" style="overflow-x:auto"></div><p class="note">Толщина потока — число сессий. В каждом столбце показаны 7 самых частых шагов, остальные объединены в «Другое». Наведите на узел, чтобы подсветить его потоки.</p></div>
  <div class="card"><div class="card-h"><div><h2>Самые частые пути</h2><div class="sub">Полная последовательность первых шагов</div></div></div><div class="tbl-wrap" id="jr-top"></div></div>`;
  $('#jr-start').value=JR.start;$('#jr-start').onchange=e=>{JR.start=e.target.value;drawJourneys()};
  $$('#jr-cols button').forEach(b=>b.onclick=()=>{JR.cols=+b.dataset.v;drawJourneys()});
  drawJourneys();
}
function drawJourneys(){
  $$('#jr-cols button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.v===JR.cols));
  const C=JR.cols,paths=[],pathS={};
  for(const s of ACT){let q=seqOf(s);if(JR.start!=='start'){const i=q.indexOf(JR.start);if(i<0)continue;q=q.slice(i)}if(!q.length)continue;
    q=q.slice(0,C);if(q.length<C)q.push('Выход');paths.push(q);const key=q.join(' → ');(pathS[key]||(pathS[key]=[])).push(s)}
  const N=paths.length;$('#jr-sub').textContent=`${fmt(N)} ${plural(N,'сессия','сессии','сессий')} · ${rangeText()}`;
  // per column top nodes
  const cols=[];for(let c=0;c<C;c++){const m={};for(const p of paths)if(p[c])m[p[c]]=(m[p[c]]||0)+1;const keys=Object.entries(m).sort((a,b)=>b[1]-a[1]);const keep=new Set(keys.slice(0,7).map(k=>k[0]));keep.add('Выход');cols.push(keep)}
  const nodeOf=(p,c)=>p[c]===undefined?null:(cols[c].has(p[c])?p[c]:'Другое');
  const nodes=[];const nidx={};const links={};
  for(const p of paths){for(let c=0;c<C;c++){const a=nodeOf(p,c);if(!a)break;const ka=c+'|'+a;if(!(ka in nidx)){nidx[ka]=nodes.length;nodes.push({c,name:a,v:0,in:0,out:0})}nodes[nidx[ka]].v++;
    if(a==='Выход')break;const b=nodeOf(p,c+1);if(!b)break;const kb=(c+1)+'|'+b;const lk=ka+'>'+kb;links[lk]=(links[lk]||0)+1}}
  const W=Math.max(760,Math.round($('#jr-sankey').clientWidth||0)),H=440,nw=12,pad=10,T=10;const colX=c=>16+c*(W-200)/(C-1);
  const colTot=[];for(let c=0;c<C;c++)colTot[c]=nodes.filter(n=>n.c===c).reduce((a,n)=>a+n.v,0);
  const maxN=Math.max(...[...Array(C).keys()].map(c=>nodes.filter(n=>n.c===c).length));
  const sc=(H-T-10-pad*(maxN-1))/Math.max(1,...colTot);
  for(let c=0;c<C;c++){let y=T;nodes.filter(n=>n.c===c).sort((a,b)=>(a.name==='Выход')-(b.name==='Выход')||(a.name==='Другое')-(b.name==='Другое')||b.v-a.v).forEach(n=>{n.y=y;n.h=Math.max(2,n.v*sc);y+=n.h+pad})}
  let s=`<svg class="sankey" viewBox="0 0 ${W} ${H}" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="Карта путей пользователей">`;
  const lkArr=Object.entries(links).map(([k,v])=>{const [a,b]=k.split('>');return {a:nodes[nidx[a]],b:nodes[nidx[b]],v}}).sort((x,y)=>x.a.y-y.a.y||x.b.y-y.b.y);
  lkArr.forEach(l=>{const w=l.v*sc,x0=colX(l.a.c)+nw,x1=colX(l.b.c),y0=l.a.y+l.a.out+w/2,y1=l.b.y+l.b.in+w/2;l.a.out+=w;l.b.in+=w;const mx=(x0+x1)/2;
    s+=`<path class="lk" data-a="${l.a.c}|${l.a.name}" data-b="${l.b.c}|${l.b.name}" d="M${x0},${y0}C${mx},${y0} ${mx},${y1} ${x1},${y1}" stroke="${JCOL[l.a.name]||'var(--soft)'}" stroke-width="${Math.max(1,w)}" data-tip="${esc(`<b>${l.a.name} → ${l.b.name}</b><div class="tr"><span>Сессии</span><span>${fmt(l.v)}</span></div><div class="tr"><span>Из «${l.a.name}»</span><span>${pct(l.v,l.a.v)}%</span></div>`)}"/>`});
  nodes.forEach(n=>{const x=colX(n.c);const lab=n.h>=14;s+=`<g class="nd" data-n="${n.c}|${n.name}"><rect x="${x}" y="${n.y}" width="${nw}" height="${n.h}" fill="${JCOL[n.name]||'var(--muted)'}" data-tip="${esc(`<b>Шаг ${n.c+1}: ${n.name}</b><div class="tr"><span>Сессии</span><span>${fmt(n.v)}</span></div><div class="tr"><span>Доля шага</span><span>${pct(n.v,colTot[n.c])}%</span></div>`)}"/>${lab?`<text x="${x+nw+6}" y="${n.y+n.h/2-1}" dominant-baseline="middle">${esc(n.name)}</text><text class="v" x="${x+nw+6}" y="${n.y+n.h/2+12}" dominant-baseline="middle">${fmt(n.v)} · ${pct(n.v,colTot[n.c],0)}%</text>`:''}</g>`});
  for(let c=0;c<C;c++)s+=`<text class="v" x="${colX(c)}" y="${H-1}">шаг ${c+1}</text>`;
  s+='</svg>';
  const host=$('#jr-sankey');host.innerHTML=s;const svg=host.querySelector('svg');bindTips(host);
  svg.addEventListener('mouseover',e=>{const g=e.target.closest('.nd');if(!g)return;svg.classList.add('hov');const id=g.dataset.n;svg.querySelectorAll('.lk').forEach(p=>p.classList.toggle('hi',p.dataset.a===id||p.dataset.b===id))});
  svg.addEventListener('mouseout',e=>{if(!e.relatedTarget||!e.relatedTarget.closest||!e.relatedTarget.closest('.nd')){svg.classList.remove('hov')}});
  const top=Object.entries(pathS).sort((a,b)=>b[1].length-a[1].length).slice(0,12);
  $('#jr-top').innerHTML=`<table><thead><tr><th>Путь</th><th class="num">Сессии</th><th class="num">Доля</th><th></th></tr></thead><tbody>${top.map(([k,ss],i)=>`<tr><td>${k.split(' → ').map(x=>`<span class="pill" style="${x==='Оплата ✗'?'background:var(--crit-soft);color:var(--crit)':x==='Оплата ✓'||x==='Касса'?'background:var(--good-soft);color:var(--good)':''}">${esc(x)}</span>`).join(' → ')}</td><td class="num">${fmt(ss.length)}</td><td class="num">${pct(ss.length,N)}%</td><td class="num"><button type="button" class="btn ghost sm" data-p="${i}">Записи</button></td></tr>`).join('')}</tbody></table>`;
  $$('#jr-top [data-p]').forEach(b=>b.onclick=()=>{const [k,ss]=top[+b.dataset.p];openRecordingsFor({label:'путь '+k,sessions:ss})});
}

/* ================= FRUSTRATION ================= */
let FRSEL='uturn';
function sigSessions(g){const out=[];for(const s of ACT)if(S_fl[s]&g.bit)out.push(s);return out}
function renderFrustration(){
  const view=$('#view'),days=rangeDays(),n=ACT.length;
  const per={};SIGNALS.forEach(g=>{per[g.id]={s:0,ev:0,day:new Array(DAYS.length).fill(0)}});
  const dayS=new Array(DAYS.length).fill(0);const score=[0,0,0,0,0,0];
  for(const s of ACT){dayS[S_d[s]]++;score[S_sc[s]]++;for(const g of SIGNALS)if(S_fl[s]&g.bit){per[g.id].s++;per[g.id].day[S_d[s]]++}
    const a=S_e0[s],b=a+S_en[s];for(let e=a;e<b;e++){const f=E_f[e];if(!f)continue;for(const g of SIGNALS)if(f&g.bit)per[g.id].ev++}}
  per.bounce.ev=per.bounce.s;
  view.innerHTML=headHtml('Фрустрация','Сигналы проблемных сессий, восстановленные из событий GA. Выберите сигнал — ниже появятся места, где он случается, и записи для просмотра.')+gapWarn('сигналы «Ошибка оплаты» и «Отказ от регистрации» за эти дни не считаются')+`
  <div class="sigs" id="sigs">${SIGNALS.map(g=>{const P=per[g.id];return `<button type="button" class="sig" data-id="${g.id}" aria-pressed="${FRSEL===g.id}"><span class="t">${g.name}<span class="sev" style="background:${SEVC[g.sev]}" aria-hidden="true"></span></span><span class="v">${pct(P.s,n)}%<small>${fmt(P.s)} ${plural(P.s,'сессия','сессии','сессий')}</small></span><span class="d">${g.d}</span>${spark(days.map(d=>dayS[d]?P.day[d]/dayS[d]*100:0),SEVC[g.sev])}</button>`}).join('')}</div>
  <div class="g-main"><div class="card" id="fr-detail"></div>
  <div class="card"><h2>Оценка фрустрации</h2><div class="sub" style="margin-bottom:12px">Сессии по шкале от 1 до 5</div>${hbars([5,4,3,2,1].map(i=>[i+(i===1?' — без сигналов':i===5?' — максимум':''),score[i],i>=3?'var(--crit)':i===2?'var(--serious)':'var(--soft)']),{total:n})}
   <p class="note">Оценка складывается из сигналов сессии с весами: ошибка оплаты и страница ошибки — сильнее всего, затем rage-клики и U-turn, слабее — повторы, быстрые выходы из игр, закрытие пре-плей окна, поиск без выбора и быстрый уход.</p>
   <button type="button" class="btn" id="fr-worst" style="margin-top:12px">Смотреть самые фрустрирующие записи</button></div></div>`;
  $$('#sigs .sig').forEach(b=>b.onclick=()=>{FRSEL=b.dataset.id;$$('#sigs .sig').forEach(x=>x.setAttribute('aria-pressed',x===b));drawFrDetail()});
  $('#fr-worst').onclick=()=>{REC.set=null;REC.setLabel='';REC.focusEl=null;REC.sig='any';REC.sort='frus';REC.pageNo=0;REC.cur=-1;location.hash='recordings'};
  drawFrDetail();
}
function drawFrDetail(){
  const g=SIGNALS.find(x=>x.id===FRSEL),ss=sigSessions(g);const where={};let tot=0;
  for(const s of ss){const a=S_e0[s],b=a+S_en[s];
    if(g.where==='session'){for(let e=a;e<b;e++)if(E_k[e]===0){const l=GRP[P_grp[E_p[e]]].label;where[l]=(where[l]||0)+1;tot++;break}continue}
    let prevPv=-1;
    for(let e=a;e<b;e++){const f=E_f[e];
      if(g.where==='uturn'&&E_k[e]===0){if((f&g.bit)&&prevPv>=0){const l=pageLabel(E_p[prevPv]);where[l]=(where[l]||0)+1;tot++}prevPv=e;continue}
      if(!(f&g.bit))continue;
      let l;if(g.where==='el')l=EL[E_z[e]][1];else if(g.where==='page')l=g.id==='srch'?GRP[P_grp[E_p[e]]].label:pageLabel(E_p[e]);else l=coName(S_co[s])+' · '+DEVN[S_dv[s]];
      where[l]=(where[l]||0)+1;tot++}}
  const rows=Object.entries(where).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const byDev=[0,1].map(d=>{let a=0,b=0;for(const s of ACT)if(S_dv[s]===d){b++;if(S_fl[s]&g.bit)a++}return [DEVN[d],a,b]});
  const byAu=[1,0].map(d=>{let a=0,b=0;for(const s of ACT)if(S_au[s]===d){b++;if(S_fl[s]&g.bit)a++}return [d?'Игроки в аккаунте':'Гости',a,b]});
  const segRows=byDev.concat(byAu).map(([l,a,b])=>[l,a,b,b?a/b:0]),maxR=Math.max(1e-9,...segRows.map(r=>r[3]));
  const whereT={el:'Элементы',page:g.id==='srch'?'Страницы, где закрыли поиск':g.id==='qgame'?'Игры, которые быстро закрывают':'Страницы',uturn:'Страницы, с которых возвращаются',none:'Страна и устройство',session:'Страница входа'}[g.where];
  $('#fr-detail').innerHTML=`<div class="card-h"><div><h2>${g.name}</h2><div class="sub">${g.d}</div></div><button type="button" class="btn" id="fr-rec" ${ss.length?'':'disabled'}>Записи · ${fmt(ss.length)}</button></div>
   <div class="grid2"><section><h4 style="font-size:13px;margin-bottom:10px">${whereT}</h4>${hbars(rows,{total:tot,color:SEVC[g.sev]})}</section>
   <section><h4 style="font-size:13px;margin-bottom:10px">Частота по сегментам</h4><div class="hl">${segRows.map(([l,a,b,r])=>`<div class="r"><span>${l}</span><b>${pct(a,b)}%<small>${fmt(a)} из ${fmt(b)}</small></b><i style="width:${Math.max(1.5,r/maxR*100)}%;--hc:${SEVC[g.sev]}"></i></div>`).join('')}</div></section></div>`;
  $('#fr-rec').onclick=()=>{REC.set=null;REC.setLabel='';REC.focusEl=null;REC.sig=g.id;REC.sort='frus';REC.pageNo=0;REC.cur=-1;location.hash='recordings'};
}

/* ================= TRENDS ================= */
const TRM=[
 ['sessions','Сессии',fmt,''],['users','Пользователи',fmt,''],['pv','Просмотры страниц',fmt,''],['clicks','Клики',fmt,''],['pps','Страниц за сессию',fmt1,''],['dur','Медиана сессии, мин',fmt1,''],
 ['game','Сессии с запуском игры, %',fmt1,'%'],['cash','Сессии с кликом «Депозит», %',fmt1,'%'],['payok','Возвраты success=true',fmt,''],['payfail','Ошибки оплаты',fmt,''],['frus','Фрустрация 3+, % сессий',fmt1,'%'],['uturn','U-turn, % сессий',fmt1,'%']
];
const TR={m:'sessions',by:'dev'};
function trendValue(list,m){
  if(m==='sessions')return list.length;if(m==='users')return uniqUsers(list);
  let pv=0,cl=0,g=0,c=0,po=0,pf=0,fr=0,ut=0;const durs=[];
  for(const s of list){const a=S_e0[s],b=a+S_en[s];let hg=0,hc=0;for(let e=a;e<b;e++){const k=E_k[e];if(k===0){pv++;if(P_cat[E_p[e]]===3)hg=1}else if(k===3)hc=1;else if(k===15)po++;else if(k===16)pf++;else if(isClickK(k)){cl++;if(DEPZ.has(E_z[e]))hc=1}}
    g+=hg;c+=hc;if(S_sc[s]>=3)fr++;if(S_fl[s]&FL.UTURN)ut++;durs.push(S_dur[s])}
  const n=list.length||1;
  return {pv,clicks:cl,pps:pv/n,dur:median(durs)/60,game:g/n*100,cash:c/n*100,payok:po,payfail:pf,frus:fr/n*100,uturn:ut/n*100}[m];
}
function renderTrends(){
  const view=$('#view');
  view.innerHTML=headHtml('Тренды','Любая метрика по дням с разбивкой по сегментам — чтобы увидеть, что изменилось после релиза или акции.')+gapWarn('касса и оплата за эти дни равны нулю')+`
  <div class="card"><div class="card-h"><div><h2 id="tr-title"></h2><div class="sub">${rangeText()}</div></div>
   <div style="display:flex;gap:8px;flex-wrap:wrap"><select class="sel" id="tr-m" aria-label="Метрика">${TRM.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join('')}</select>
   <div class="seg" role="group" aria-label="Разбивка" id="tr-by"><button type="button" data-v="none">Всего</button><button type="button" data-v="dev">Устройства</button><button type="button" data-v="au">Игроки / гости</button></div></div></div>
   <div class="legend" id="tr-leg" style="margin-bottom:8px"></div><div id="tr-chart"></div></div>
  <div class="card"><h2>Таблица</h2><div class="tbl-wrap" id="tr-tbl" style="margin-top:10px"></div></div>`;
  $('#tr-m').value=TR.m;$('#tr-m').onchange=e=>{TR.m=e.target.value;drawTrends()};
  $$('#tr-by button').forEach(b=>b.onclick=()=>{TR.by=b.dataset.v;drawTrends()});
  drawTrends();
}
function drawTrends(){
  $$('#tr-by button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===TR.by));
  const M=TRM.find(m=>m[0]===TR.m),days=rangeDays();$('#tr-title').textContent=M[1];
  const segs=TR.by==='dev'?[['Mobile',s=>S_dv[s]===0,'var(--s1)'],['Desktop',s=>S_dv[s]===1,'var(--s2)']]:TR.by==='au'?[['Игроки в аккаунте',s=>S_au[s]===1,'var(--s1)'],['Гости',s=>S_au[s]===0,'var(--s2)']]:[['Все сессии',()=>true,'var(--s1)']];
  const byDay=days.map(d=>ACT.filter(s=>S_d[s]===d));
  const series=segs.map(([nm,f,col])=>({name:nm,color:col,values:byDay.map(l=>trendValue(l.filter(f),TR.m))}));
  $('#tr-leg').innerHTML=series.length>1?series.map(s=>`<span style="--c:${s.color}">${s.name}</span>`).join(''):'';
  lineChart($('#tr-chart'),{days,series,yfmt:M[2],unit:M[3],height:260});
  $('#tr-tbl').innerHTML=`<table><thead><tr><th>День</th>${series.map(s=>`<th class="num">${s.name}</th>`).join('')}</tr></thead><tbody>${days.map((d,i)=>`<tr><td>${DAYL[d]}${PARTIAL.has(d)?' <span class="muted">(неполный)</span>':''}</td>${series.map(s=>`<td class="num">${M[2](s.values[i])}${M[3]}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

<script>
/* «Выводы»: разбор метрик Magic365 в роли продуктового дизайнера. Текст написан 18.11.2026 по выгрузке 6–10.11.2026. */
'use strict';
const FD={tab:'all'};
const PRI={crit:['Критично','var(--crit)'],high:['Высокий','var(--serious)'],mid:['Средний','var(--warn)'],obs:['Наблюдение','var(--accent-ink)']};

// переходы из выводов в модули
const FD_ACT={

<script>
/* routing, page header, filters, search, theme, startup */
'use strict';
const ROUTES={overview:renderOverview,heatmaps:renderHeatmaps,recordings:renderRecordings,funnels:renderFunnels,journeys:renderJourneys,frustration:renderFrustration,trends:renderTrends,findings:renderFindings};
const ROUTE_NAMES={overview:'Обзор',heatmaps:'Тепловые карты',recordings:'Записи сессий',funnels:'Воронки',journeys:'Пути',frustration:'Фрустрация',trends:'Тренды',findings:'Выводы'};
let ROUTE='overview';
function render(){
  const h=location.hash.slice(1);ROUTE=ROUTES[h]?h:'overview';
  if(typeof stopPlay==='function'&&ROUTE!=='recordings')stopPlay();
  $$('#mods a,#mob-mods a').forEach(a=>{const on=a.dataset.r===ROUTE;a.classList.toggle('on',on);if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  hideTip();closeDrawerSilently();
  ROUTES[ROUTE]();
  hoistHead();
  $('#fbar').classList.toggle('dim',ROUTE==='findings');
}
// move the module's title and description into the page header; other controls stay at the top of the content
function hoistHead(){
  const h=$('#view > .head');const t=$('#pg-title'),p=$('#pg-sub');
  if(!h){if(!$('#view h1')){t.textContent=ROUTE_NAMES[ROUTE];p.textContent='';$('#ph-extra').innerHTML=''}return}
  if(!h.querySelector('h1'))return;
  const x=$('#ph-extra');x.innerHTML='';
  const h1=h.querySelector('h1'),pp=h.querySelector('p');
  t.textContent=h1?h1.textContent:ROUTE_NAMES[ROUTE];p.innerHTML=pp?pp.innerHTML:'';
  const box=h1?h1.parentElement:null;if(box&&box!==h)box.remove();else{if(h1)h1.remove();if(pp)pp.remove()}
  while(h.firstElementChild)x.appendChild(h.firstElementChild);h.remove();
  document.title=(ROUTE==='overview'?'':ROUTE_NAMES[ROUTE]+' · ')+'Magic365 Insights';
}
function closeDrawerSilently(){$('#dw').hidden=true;$('#scrim').hidden=true}
function updateCounts(){
  const n=ACT.length;$('#f-count').innerHTML=`<b>${fmt(n)}</b> ${plural(n,'сессия','сессии','сессий')} · <b>${fmt(uniqUsers(ACT))}</b> польз.`;
  let fr=0;for(const s of ACT)if(S_sc[s]>=3)fr++;$('#frus-bdg').textContent=fr?fmt(fr):'';$('#btn-bell .dot').hidden=!fr;
  $('#dp-label').textContent=rangeText();
  $('#f-reset').hidden=F.d0===0&&F.d1===LAST&&F.dev==='all'&&F.au==='all'&&F.co==='all'&&F.sr==='all';
}
function syncFilterUI(){$('#f-dev').value=F.dev;$('#f-au').value=F.au;$('#f-co').value=F.co;$('#f-sr').value=F.sr}
function refreshAll(){applyFilters();updateCounts();render()}

/* date picker: 26.10–15.11, days without an export are disabled */
const DAYS_ALL=['2026-11-02','2026-11-03','2026-11-04','2026-11-05','2026-11-06','2026-11-07','2026-11-08','2026-11-09','2026-11-10','2026-11-11','2026-11-12','2026-11-13','2026-11-14','2026-11-15'];
let pend=null;
const PRE=()=>[['Весь период',0,LAST],['6–9 ноя',0,3],['Выходные 7–8 ноя',1,2],['10 ноя',4,4]];
function drawPicker(){
  const [a,b]=pend||[F.d0,F.d1];
  $('#dp-pre').innerHTML=PRE().map(([l,x,y])=>`<button type="button" data-a="${x}" data-b="${y}" aria-pressed="${a===x&&b===y}">${l}</button>`).join('');
  $('#dp-grid').innerHTML=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(d=>`<span class="wd">${d}</span>`).join('')+DAYS_ALL.map(ds=>{const i=DAYS.indexOf(ds),[y,m,d]=ds.split('-');const dd=+d;
    if(i<0)return `<button type="button" disabled title="${dd}.${m}: нет выгрузки">${dd}</button>`;
    const cls=[i>a&&i<b?'in':'',i===a?'a':'',i===b?'b':''].join(' ');
    return `<button type="button" class="${cls}" data-i="${i}" aria-label="${dd}.${m}.2026" aria-pressed="${i>=a&&i<=b}">${dd}${dd===2?`<small>ноя</small>`:''}</button>`}).join('');
  const n=b-a+1;$('#dp-sel').textContent=pend&&pend.half?'Выберите последний день':`${a===b?DAYL[a]:DAYL[a]+' – '+DAYL[b]} · ${n} ${plural(n,'день','дня','дней')} с данными`;
  $('#dp-apply').disabled=!!(pend&&pend.half);
}
function openPicker(open){$('#dp-pop').hidden=!open;$('#dp-btn').setAttribute('aria-expanded',open);if(open){pend=null;drawPicker()}}
function setRange(a,b){F.d0=a;F.d1=b;openPicker(false);refreshAll()}

/* theme */
function effTheme(){const t=document.documentElement.dataset.theme;return t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function setTheme(t){document.documentElement.dataset.theme=t;try{localStorage.setItem('si-theme',t)}catch(e){}
  $('#btn-theme').innerHTML=t==='dark'?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>':'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  $('#btn-theme').setAttribute('aria-label',t==='dark'?'Светлая тема':'Тёмная тема');
  if(ACT&&(ROUTE==='heatmaps'||ROUTE==='overview'||ROUTE==='trends'||ROUTE==='funnels'))render()}

/* search: sections, pages, elements, signals */
let QIDX=null,QSEL=0,QRES=[];
function buildIndex(){
  const out=[];
  for(const [r,n] of Object.entries(ROUTE_NAMES))out.push({g:'Разделы',l:n,m:'',go:()=>{location.hash=r}});
  for(const g of SIGNALS)out.push({g:'Сигналы',l:g.name,m:'фрустрация',go:()=>{FRSEL=g.id;location.hash='frustration'}});
  PRESETS.forEach((p,i)=>out.push({g:'Воронки',l:p[0],m:'воронка',go:()=>{FN.preset=i;FN.steps=p[1].slice();location.hash='funnels'}}));
  const pv=new Map();for(let e=0;e<NE;e++)if(E_k[e]===0){const g=P_grp[E_p[e]];pv.set(g,(pv.get(g)||0)+1)}
  [...pv.entries()].sort((a,b)=>b[1]-a[1]).slice(0,60).forEach(([g,n])=>{const k=GRP[g].key,hm=hmKeyOf(k);
    out.push({g:'Страницы',l:GRP[g].label,m:fmt(n)+' просм.',go:()=>{if(hm){HM.page=hm;HM.other=null}else HM.other=g;HM.mode='click';location.hash='heatmaps'}})});
  const ec=new Int32Array(EL.length);for(let e=0;e<NE;e++)ec[E_z[e]]++;
  EL.forEach((e,z)=>{if(!z||!ec[z]||e[4]===15||e[4]===16)return;out.push({g:'Элементы',l:e[1],m:fmt(ec[z])+' соб.',go:()=>{const ss=[];for(const s of ACT){const a=S_e0[s],b=a+S_en[s];for(let i=a;i<b;i++)if(E_z[i]===z){ss.push(s);break}}openRecordingsFor({label:e[1],sessions:ss,focusEl:z})}})});
  // games
  const gc=new Map();for(let e=0;e<NE;e++)if(E_k[e]===0&&P_cat[E_p[e]]===3)gc.set(E_p[e],(gc.get(E_p[e])||0)+1);
  [...gc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,300).forEach(([p,n])=>out.push({g:'Игры',l:pageLabel(p),m:fmt(n)+' запусков',go:()=>{const ss=[];for(const s of ACT){const a=S_e0[s],b=a+S_en[s];for(let i=a;i<b;i++)if(E_p[i]===p&&E_k[i]===0){ss.push(s);break}}openRecordingsFor({label:'игра '+pageLabel(p),sessions:ss})}}));
  return out;
}
const norm=s=>s.toLowerCase().replace(/ё/g,'е');
function runSearch(){
  const q=norm($('#q').value.trim()),box=$('#q-res');
  if(!q){box.hidden=true;$('#q').setAttribute('aria-expanded','false');return}
  if(!QIDX)QIDX=buildIndex();
  const words=q.split(/\s+/);QRES=QIDX.filter(it=>{const s=norm(it.l+' '+it.g);return words.every(w=>s.includes(w))});
  const groups={};QRES.forEach(it=>(groups[it.g]||(groups[it.g]=[])).push(it));
  QRES=[];let html='';for(const [g,arr] of Object.entries(groups)){html+=`<h5>${g}</h5>`;arr.slice(0,6).forEach(it=>{html+=`<button type="button" role="option" data-i="${QRES.length}"><span>${esc(it.l)}</span><small>${esc(it.m)}</small></button>`;QRES.push(it)})}
  box.innerHTML=html||'<div class="none">Ничего не найдено</div>';QSEL=0;markSel();box.hidden=false;$('#q').setAttribute('aria-expanded','true');
}
function markSel(){$$('#q-res button').forEach((b,i)=>{b.classList.toggle('on',i===QSEL);if(i===QSEL)b.scrollIntoView({block:'nearest'})})}
function pickSearch(i){const it=QRES[i];if(!it)return;$('#q').value='';$('#q-res').hidden=true;$('#q').blur();it.go()}

/* methodology */
function openMethod(){
  openDrawer(`<div class="dw-h"><div><h3 id="dw-t">Как считаем</h3><p>Источник — выгрузки GA4 / GTM по бренду Magic365</p></div><button type="button" class="xbtn" aria-label="Закрыть">×</button></div>
  <dl>
   <dt>Данные</dt><dd>stat_clicks_pages_11_11.xlsx (лист «Аркуш1», brand = magic365): 6–10.11.2026, полные дни по Киеву. Из stat_clicks_pages_09_11_26_allBrands.xlsx добавлены события, которых нет в основной выгрузке: чат поддержки, выбор языка, платёжный метод и «Ещё провайдеры» — только за 6–9.11. Домен magic365.com, все языки: ${fmt(NS)} сессий, ${fmt(NE)} событий.</dd>
   <dt>Что исключено</dt><dd>Сессии со stage-хоста (magic365-stage.playgr.xyz), с QA-источниками (qa_*), tagassistant, backoffice и gtm_debug — ${fmt(DB.meta.internal_excluded)} событий. Одинаковые события чаще, чем раз в 0,1 с, — дубль трекинга: убрано ${fmt(DB.meta.dups.clicks)} кликов и ${fmt(DB.meta.dups.pv)} просмотров.</dd>
   <dt>Сессия и пользователь</dt><dd>Сессия — user_pseudo_id + session_id. «Игрок в аккаунте» — если user_id есть хотя бы у одного события сессии, «гость» — если нет ни у одного.</dd>
   <dt>Запуск игры</dt><dd>Просмотр страницы /game/…/real (на деньги) или /demo. События start_game и start_game_real не используются: второе дублирует первое с mode = real.</dd>
   <dt>Клики</dt><dd>Все события взаимодействия (game_item_click, navigation_click, banner_click, provider_click, more_click, modal_close, search_close и др.), кроме page_view и возвратов с оплаты.</dd>
   <dt>Депозит и оплата</dt><dd>Событие кассы (cashbox_deposit) в Magic365 не отправляется, поэтому «Депозит» — клик по кнопке в шапке игры или нижней панели. Возврат с оплаты — page_view с параметром success=true/false, пришедший не с magic365.com.</dd>
   <dt>Сигналы фрустрации</dt><dd>Rage — 3+ одинаковых клика за ≤5 с; повтор — 2 клика с паузой ≤2,5 с; U-turn — A → B → A, на B ≤7 с; быстрый выход из игры — страница игры ≤10 с; страница ошибки — /error/*; пре-плей окно — закрыл окно игры перед запуском; поиск без выбора — search_close; быстрый уход — одна страница, ни одного клика, меньше 10 с. Оценка 1–5 — взвешенная сумма сигналов сессии.</dd>
   <dt>Тепловые карты и скролл</dt><dd>Скриншотов сайта в данных нет, поэтому страницы нарисованы схемой: блоки в порядке, как на сайте, зоны — элементы, которые отправляют события в GTM. Скролл восстановлен по самому нижнему блоку с кликом: это нижняя оценка глубины.</dd>
   <dt>Ограничения выгрузки</dt><dd>Нет cashbox_deposit, sign_up_submit, modal_click, promo_click, tournament_click, filters_* и search_open (у Slottica есть). session_source в 68% сессий «(not set)», ещё 12,5% сессий начинаются с возврата с платёжки, KYC или входа через Google.</dd>
  </dl>`);
}

  const sr={};for(let s=0;s<NS;s++)sr[S_sr[s]]=(sr[S_sr[s]]||0)+1;
  $('#f-sr').innerHTML='<option value="all">Все источники</option>'+Object.entries(sr).sort((a,b)=>b[1]-a[1]).map(([c,n])=>`<option value="${c}">${esc(DB.src[+c])} · ${fmt(n)}</option>`).join('');
  sel('f-co','co');sel('f-sr','sr');
  $('#f-reset').onclick=()=>{Object.assign(F,{d0:0,d1:LAST,dev:'all',au:'all',co:'all',sr:'all'});syncFilterUI();refreshAll()};
  $('#dp-btn').addEventListener('click',e=>{e.stopPropagation();openPicker($('#dp-pop').hidden)});
  $('#dp-pop').addEventListener('click',e=>{e.stopPropagation();
    const pb=e.target.closest('#dp-pre button');if(pb){setRange(+pb.dataset.a,+pb.dataset.b);return}
    const db=e.target.closest('#dp-grid button[data-i]');if(db){const i=+db.dataset.i;if(!pend||!pend.half){pend=[i,i];pend.half=true}else{const a=pend[0];pend=[Math.min(a,i),Math.max(a,i)]}drawPicker();return}
    if(e.target.closest('#dp-apply')){const r=pend||[F.d0,F.d1];setRange(r[0],r[1])}});
  document.addEventListener('click',e=>{if(!$('#dp-pop').hidden)openPicker(false);if(!e.target.closest('#search'))$('#q-res').hidden=true});
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();$('#q').select();return}
    if(e.key==='Escape'){if(!$('#q-res').hidden){$('#q-res').hidden=true;return}if(!$('#dp-pop').hidden){openPicker(false);$('#dp-btn').focus()}else if(!$('#dw').hidden)closeDrawer()}});
  $('#q').addEventListener('input',runSearch);$('#q').addEventListener('focus',()=>{if($('#q').value)runSearch()});
  $('#q').addEventListener('keydown',e=>{if($('#q-res').hidden)return;
    if(e.key==='ArrowDown'){e.preventDefault();QSEL=Math.min(QRES.length-1,QSEL+1);markSel()}
    else if(e.key==='ArrowUp'){e.preventDefault();QSEL=Math.max(0,QSEL-1);markSel()}
    else if(e.key==='Enter'){e.preventDefault();pickSearch(QSEL)}});
  $('#q-res').addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)pickSearch(+b.dataset.i)});
  $('#scrim').addEventListener('click',closeDrawer);
  $('#btn-method').onclick=openMethod;
  $('#btn-theme').onclick=()=>setTheme(effTheme()==='dark'?'light':'dark');
  let saved=null;try{saved=localStorage.getItem('si-theme')}catch(e){}if(saved)setTheme(saved);
  {const b=$('.brand').cloneNode(true);b.classList.add('top-brand');b.querySelectorAll('clipPath[id]').forEach(c=>{const o=c.id;c.id=o+'-top';b.querySelectorAll('[clip-path="url(#'+o+')"]').forEach(g=>g.setAttribute('clip-path','url(#'+o+'-top)'))});$('.topbar').prepend(b)}
  $('#mob-mods').innerHTML=$$('#mods a').map(a=>`<a href="${a.getAttribute('href')}" data-r="${a.dataset.r}">${a.querySelector('span').textContent}</a>`).join('');
  $('#src-n').textContent=`${fmt(NS)} сессий · ${fmt(NE)} событий`;
}
addEventListener('hashchange',render);
// modules re-render themselves (tabs, widget changes): keep the title in the page header
new MutationObserver(()=>{const h=$('#view > .head');if(h&&h.querySelector('h1'))hoistHead()}).observe(document.getElementById('view'),{childList:true});
(async()=>{
  try{await loadData()}catch(err){$('#loading').innerHTML=`<b>Не удалось загрузить данные.</b><span>Обновите страницу. (${esc(err.message)})</span>`;return}
  initUI();refreshAll();
})();

</script>
</body>
